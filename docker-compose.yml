# Neutrino website (neutrino.ytosko.dev)
# Coolify: create a "Docker Compose" resource from this repo, then set the
# domain of the `web` service to https://neutrino.ytosko.dev (container port 8080).
services:
  web:
    build:
      context: ./web
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
