name: Release

# Push a tag like v1.0.0 to build, test, sign and publish the APK on GitHub Releases.
# Needs four repository secrets (Settings > Secrets and variables > Actions), see docs/RELEASING.md:
#   NEUTRINO_KEYSTORE_BASE64, NEUTRINO_KEYSTORE_PASSWORD, NEUTRINO_KEY_ALIAS, NEUTRINO_KEY_PASSWORD
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NEUTRINO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEUTRINO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEUTRINO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEUTRINO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Signing secrets are missing, see docs/RELEASING.md"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build
        run: ./gradlew --no-daemon -PversionName=${{ steps.version.outputs.name }} :app:testFullDebugUnitTest :glucose-ble:testDebugUnitTest :app:assembleFullRelease

      - name: Check the signing certificate
        # Only builds signed with the registered key can use Google Drive backup, so refuse anything else.
        run: |
          APK=app/build/outputs/apk/full/release/app-full-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          grep -qi "SHA-1 digest: a552b9634ff966585a64280484cb904038565c72" certs.txt \
            || { echo "::error::APK is not signed with the Neutrino release key"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          # Release notes come from this version's CHANGELOG.md section; no section, no release.
          HEADING=$(grep -m1 -F "## [$VERSION]" CHANGELOG.md || true)
          if [ -z "$HEADING" ]; then echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; fi
          # "## [1.2.3] - 2026-01-01 · v1.4-NeutrinoBuddy" -> title and file name "v1.4-NeutrinoBuddy".
          NAME=$(echo "$HEADING" | sed -n 's/.*· *//p')
          APK="neutrino-${NAME:-$VERSION}.apk"
          cp app/build/outputs/apk/full/release/app-full-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"

          awk -v h="$HEADING" '$0 == h { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes.md
          {
            echo
            echo "### Checksum"
            echo "SHA-256 \`$(cut -d' ' -f1 "$APK.sha256")\`"
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "${NAME:-Neutrino $VERSION}" --notes-file notes.md

      - name: Remove signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
