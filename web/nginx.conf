# Neutrino website — static site served by unprivileged nginx on :8080.
# TLS is terminated by the reverse proxy in front (Coolify / Traefik).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Privacy: the site's privacy policy promises no access logs.
    access_log off;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml;

    error_page 404 /404.html;

    # Clean URLs: /privacy -> privacy.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # Old-style links keep working but canonicalise to the clean URL.
    location = /privacy.html { return 301 /privacy; }
    location = /terms.html   { return 301 /terms; }

    location /assets/fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location ~* \.(?:png|ico|svg|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
